name: Build GeoTables
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build GeoTables
        run: |
          pyinstaller --onefile --windowed --name GeoTables --icon=assets/icons/icon.ico --add-data "assets;assets" app.py
      - name: Copy data files
        run: |
          copy *.json dist\
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GeoTables-Windows
          path: dist/
  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build GeoTables
        run: |
          pyinstaller --windowed --name GeoTables --icon=assets/icons/icon.icns --add-data "assets:assets" app.py
      - name: Copy data files
        run: |
          cp *.json dist/
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: GeoTables-macOS
          path: |
            dist/GeoTables.app
            dist/*.json
  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build GeoTables
        run: |
          pyinstaller --onefile --windowed --name GeoTables --add-data "assets:assets" app.py
      - name: Copy data files
        run: |
          cp *.json dist/
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: GeoTables-Linux
          path: dist/
