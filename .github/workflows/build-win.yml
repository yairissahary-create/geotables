name: Build GeoTables


on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build GeoTables
        run: |
          pyinstaller --onefile --windowed --icon=assets/icons/icon.ico --add-data "assets;assets" app.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GeoTables-Windows
          path: dist/app.exe


  macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pypdf
          pip install pyinstaller
          pip install pyinstaller

      - name: Build GeoTables
        run: |
          pyinstaller --windowed --icon=assets/icons/icon.icns --add-data "assets:assets" app.py

      - name: Rename app
        run: |
          mv "dist/app.app" "dist/GeoTables.app"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: GeoTables-macOS
          path: dist/GeoTables.app


  linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build GeoTables
        run: |
          pyinstaller --onefile --windowed --add-data "assets:assets" app.py

      - name: Rename executable
        run: |
          mv dist/app dist/GeoTables

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: GeoTables-Linux
          path: dist/GeoTables
