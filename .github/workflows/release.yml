name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "What type of release is this?"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      release_notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Get version from the most recent GitHub Release
      # ============================================================

      - name: Get current version
        id: current_version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=$(gh release view --json tagName --jq '.tagName')

          if [ -z "$TAG" ]; then
            echo "Could not find the latest GitHub release."
            exit 1
          fi

          CURRENT_VERSION="${TAG#v}"

          echo "Latest release: $TAG"
          echo "Current version: $CURRENT_VERSION"

          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. Calculate the new version
      # ============================================================

      - name: Calculate new version
        id: new_version
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$RELEASE_TYPE" in

            patch)
              PATCH=$((PATCH + 1))
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            *)
              echo "Invalid release type: $RELEASE_TYPE"
              exit 1
              ;;

          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "Current version: $CURRENT_VERSION"
          echo "Release type: $RELEASE_TYPE"
          echo "New version: $NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. Trigger Build GeoTables
      # ============================================================

      - name: Trigger Build GeoTables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering Build GeoTables..."

          gh workflow run "Build GeoTables"

          echo "Build GeoTables triggered."


      # ============================================================
      # 5. Wait for the newly triggered Build GeoTables run
      # ============================================================

      - name: Wait for Build GeoTables
        id: wait_for_build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Waiting for Build GeoTables to start..."

          BUILD_RUN_ID=""

          # Wait until the newly triggered workflow appears.
          for i in {1..30}; do

            BUILD_RUN_ID=$(gh run list \
              --workflow="Build GeoTables" \
              --limit=1 \
              --json databaseId,event,status \
              --jq '.[] | select(.event == "workflow_dispatch") | .databaseId' \
              | head -n 1)

            if [ -n "$BUILD_RUN_ID" ]; then
              echo "Found Build GeoTables run: $BUILD_RUN_ID"
              break
            fi

            echo "Build has not appeared yet..."
            sleep 5

          done

          if [ -z "$BUILD_RUN_ID" ]; then
            echo "Could not find the Build GeoTables run."
            exit 1
          fi

          echo "build_run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"

          echo "Waiting for run $BUILD_RUN_ID to finish..."

          gh run watch "$BUILD_RUN_ID" --exit-status

          echo "Build GeoTables completed successfully."


      # ============================================================
      # 6. Download artifacts from Build GeoTables
      # ============================================================

      - name: Download Build GeoTables artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.wait_for_build.outputs.build_run_id }}
        shell: bash
        run: |
          mkdir -p release_files

          echo "Downloading artifacts from run $BUILD_RUN_ID..."

          gh run download "$BUILD_RUN_ID" \
            --dir release_files

          echo ""
          echo "Downloaded files:"
          find release_files -type f -print


      # ============================================================
      # 7. Check that ZIP files were produced
      # ============================================================

      - name: Check release files
        shell: bash
        run: |
          ZIP_COUNT=$(find release_files -type f -name "*.zip" | wc -l)

          echo "Found $ZIP_COUNT ZIP file(s)."

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "No ZIP files were produced by Build GeoTables."
            exit 1
          fi

          find release_files -type f -name "*.zip" -print


      # ============================================================
      # 8. Create the Git tag
      # ============================================================

      - name: Create Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        shell: bash
        run: |
          TAG="v$NEW_VERSION"

          echo "Creating tag $TAG..."

          git tag "$TAG"
          git push origin "$TAG"

          echo "Tag created."


      # ============================================================
      # 9. Create the GitHub Release
      # ============================================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          TAG="v$NEW_VERSION"

          echo "Creating GitHub Release $TAG..."

          gh release create "$TAG" \
            release_files/**/*.zip \
            --title "GeoTables $TAG" \
            --notes "$RELEASE_NOTES"

          echo ""
          echo "========================================"
          echo "Release $TAG created successfully!"
          echo "========================================"
