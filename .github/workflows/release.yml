name: Release GeoTables

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - minor
          - medium
          - large

      release_notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Get the repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Determine the new version
      #
      # The version comes from the latest GitHub release.
      #
      # Example:
      #   latest = V1.0.1
      #
      # minor  -> V1.0.2
      # medium -> V1.1.0
      # large  -> V2.0.0
      # ------------------------------------------------------------
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}

        run: |
          set -e

          echo "Getting latest GitHub release..."

          LATEST_TAG=$(gh release list \
            --limit 1 \
            --exclude-drafts \
            --exclude-pre-releases \
            --json tagName \
            --jq '.[0].tagName')

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found."
            echo "Using V1.0.0 as the starting version."

            MAJOR=1
            MINOR=0
            PATCH=0
          else
            echo "Latest release: $LATEST_TAG"

            # Remove the V/v prefix.
            VERSION="${LATEST_TAG#V}"
            VERSION="${VERSION#v}"

            # Extract major/minor/patch.
            if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "ERROR: Latest release tag '$LATEST_TAG' is not a valid semantic version."
              exit 1
            fi

            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
          fi

          case "$RELEASE_TYPE" in

            minor)
              PATCH=$((PATCH + 1))
              ;;

            medium)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            large)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            *)
              echo "ERROR: Unknown release type: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="V$NEW_VERSION"

          echo "New version: $NEW_VERSION"
          echo "New tag: $TAG"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 3. Trigger the Build GeoTables workflow
      # ------------------------------------------------------------
      - name: Trigger Build GeoTables
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "Triggering Build GeoTables..."

          gh workflow run "Build GeoTables" \
            --ref main

          echo "Build workflow dispatched."


      # ------------------------------------------------------------
      # 4. Wait for the build workflow to start
      # ------------------------------------------------------------
      - name: Find Build GeoTables run
        id: build_run
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "Waiting for Build GeoTables to start..."

          for i in {1..30}; do

            RUN_ID=$(gh run list \
              --workflow="Build GeoTables" \
              --branch main \
              --limit 10 \
              --json databaseId,status,createdAt \
              --jq '
                map(
                  select(
                    .status == "queued" or
                    .status == "in_progress"
                  )
                )
                | sort_by(.createdAt)
                | reverse
                | .[0].databaseId
              ')

            if [ -n "$RUN_ID" ]; then
              echo "Found build run: $RUN_ID"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Build run not visible yet. Waiting..."
            sleep 5
          done

          echo "ERROR: Could not find the Build GeoTables run."
          exit 1


      # ------------------------------------------------------------
      # 5. Wait for the build to finish
      # ------------------------------------------------------------
      - name: Wait for Build GeoTables
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build_run.outputs.run_id }}

        run: |
          set -e

          echo "Waiting for Build GeoTables run $RUN_ID..."

          gh run watch "$RUN_ID" --exit-status

          echo "Build completed successfully."


      # ------------------------------------------------------------
      # 6. Download the build artifacts
      # ------------------------------------------------------------
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build_run.outputs.run_id }}

        run: |
          set -e

          rm -rf release_files
          mkdir -p release_files

          echo "Downloading artifacts from build run $RUN_ID..."

          gh run download "$RUN_ID" \
            --dir release_files

          echo
          echo "Downloaded files:"
          find release_files -type f -print


      # ------------------------------------------------------------
      # 7. Locate the three actual release ZIPs
      #
      # IMPORTANT:
      # We deliberately do NOT upload every *.zip.
      #
      # This prevents files such as:
      #
      #   base_library.zip
      #
      # from being uploaded as release assets.
      # ------------------------------------------------------------
      - name: Find release ZIPs
        id: zips
        run: |
          set -e

          WINDOWS_ZIP=$(find release_files \
            -type f \
            -name 'GeoTables-Windows.zip' \
            -print -quit)

          LINUX_ZIP=$(find release_files \
            -type f \
            -name 'GeoTables-Linux.zip' \
            -print -quit)

          MAC_ZIP=$(find release_files \
            -type f \
            -name 'GeoTables-macOS.zip' \
            -print -quit)

          echo "Windows ZIP: $WINDOWS_ZIP"
          echo "Linux ZIP:   $LINUX_ZIP"
          echo "macOS ZIP:   $MAC_ZIP"

          if [ -z "$WINDOWS_ZIP" ]; then
            echo "ERROR: GeoTables-Windows.zip was not found."
            exit 1
          fi

          if [ -z "$LINUX_ZIP" ]; then
            echo "ERROR: GeoTables-Linux.zip was not found."
            exit 1
          fi

          if [ -z "$MAC_ZIP" ]; then
            echo "ERROR: GeoTables-macOS.zip was not found."
            exit 1
          fi

          echo "windows=$WINDOWS_ZIP" >> "$GITHUB_OUTPUT"
          echo "linux=$LINUX_ZIP" >> "$GITHUB_OUTPUT"
          echo "macos=$MAC_ZIP" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 8. Create/update the GitHub release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.new_version }}

          RELEASE_NOTES: ${{ inputs.release_notes }}

          WINDOWS_ZIP: ${{ steps.zips.outputs.windows }}
          LINUX_ZIP: ${{ steps.zips.outputs.linux }}
          MAC_ZIP: ${{ steps.zips.outputs.macos }}

        run: |
          set -e

          echo "Creating/updating GitHub Release $TAG..."

          # --------------------------------------------------------
          # Write release notes to a file.
          #
          # This preserves newlines in the workflow input.
          # --------------------------------------------------------
          printf '%s\n' "$RELEASE_NOTES" > release_notes.md

          echo
          echo "Release notes:"
          echo "--------------------"
          cat release_notes.md
          echo "--------------------"
          echo

          # --------------------------------------------------------
          # Check whether this release already exists.
          #
          # This is important because a previous workflow attempt
          # may have created the release before failing while
          # uploading its assets.
          # --------------------------------------------------------
          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release $TAG already exists."
            echo "Updating existing release..."

            gh release edit "$TAG" \
              --title "V$VERSION" \
              --notes-file release_notes.md

          else

            echo "Release $TAG does not exist."
            echo "Creating it..."

            gh release create "$TAG" \
              --title "V$VERSION" \
              --notes-file release_notes.md

          fi


          # --------------------------------------------------------
          # Upload ONLY the three real platform ZIPs.
          #
          # --clobber means that if an earlier failed run uploaded
          # one of them, it will be replaced instead of failing.
          # --------------------------------------------------------
          echo "Uploading Windows ZIP..."
          gh release upload "$TAG" \
            "$WINDOWS_ZIP" \
            --clobber

          echo "Uploading Linux ZIP..."
          gh release upload "$TAG" \
            "$LINUX_ZIP" \
            --clobber

          echo "Uploading macOS ZIP..."
          gh release upload "$TAG" \
            "$MAC_ZIP" \
            --clobber


          echo
          echo "========================================"
          echo "Release completed successfully!"
          echo "Version: V$VERSION"
          echo "Tag:     $TAG"
          echo "========================================"
