name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      release_notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Determine next version
      # ============================================================
      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Finding latest release..."

          RELEASE_JSON=$(gh release list \
            --limit 20 \
            --json tagName,name,isDraft,isPrerelease,createdAt)

          echo "Releases:"
          echo "$RELEASE_JSON"

          # Find the newest release whose tag is a valid semantic version.
          #
          # This handles:
          #   V1.0.1
          #   v1.0.1
          #   1.0.1
          #
          # and ignores old/broken tags such as:
          #   fix
          #
          CURRENT=""

          while read -r TAG; do
            CLEAN="${TAG#V}"
            CLEAN="${CLEAN#v}"

            if [[ "$CLEAN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              CURRENT="$CLEAN"
              break
            fi
          done < <(
            echo "$RELEASE_JSON" |
            jq -r '.[] |
              select(.isDraft == false and .isPrerelease == false) |
              .tagName'
          )

          # If no valid semantic-version tag exists, start at 0.0.0.
          if [ -z "$CURRENT" ]; then
            echo "No valid semantic-version release found."
            CURRENT="0.0.0"
          fi

          echo "Current version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.release_type }}" in
            patch)
              PATCH=$((PATCH + 1))
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            *)
              echo "Unknown release type."
              exit 1
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="V$NEW_VERSION"

          echo "======================================"
          echo "Current version: $CURRENT"
          echo "Release type:    ${{ inputs.release_type }}"
          echo "New version:     $NEW_VERSION"
          echo "New tag:         $TAG"
          echo "======================================"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. Trigger Build GeoTables
      # ============================================================
      - name: Trigger Build GeoTables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering Build GeoTables..."

          gh workflow run "Build GeoTables" \
            --ref "${{ github.ref_name }}"

          echo "Build workflow triggered."

      # ============================================================
      # 4. Wait for Build GeoTables to appear
      # ============================================================
      - name: Find Build GeoTables run
        id: build_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for Build GeoTables run to appear..."

          for i in {1..30}; do
            RUN_ID=$(gh run list \
              --workflow="Build GeoTables" \
              --limit 20 \
              --json databaseId,headBranch,event,status,createdAt \
              --jq "
                .[]
                | select(
                    .headBranch == \"${{ github.ref_name }}\"
                    and .event == \"workflow_dispatch\"
                  )
                | .databaseId
              " |
              head -n 1)

            if [ -n "$RUN_ID" ]; then
              echo "Found Build GeoTables run: $RUN_ID"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Build run not visible yet. Attempt $i/30..."
            sleep 5
          done

          echo "ERROR: Timed out waiting for Build GeoTables."
          exit 1

      # ============================================================
      # 5. Wait for Build GeoTables to finish
      # ============================================================
      - name: Wait for Build GeoTables
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build_run.outputs.run_id }}
        run: |
          echo "Waiting for Build GeoTables run $RUN_ID..."

          gh run watch "$RUN_ID" --exit-status

          echo "Build completed successfully."

      # ============================================================
      # 6. Download build artifacts
      # ============================================================
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build_run.outputs.run_id }}
        run: |
          echo "Downloading artifacts..."

          rm -rf release_files
          mkdir -p release_files

          gh run download "$RUN_ID" \
            --dir release_files

          echo ""
          echo "Downloaded files:"
          find release_files -type f -print

      # ============================================================
      # 7. Find ZIP files
      # ============================================================
      - name: Check release files
        run: |
          echo "Searching for ZIP files..."

          mapfile -t ZIP_FILES < <(
            find release_files \
              -type f \
              -iname "*.zip"
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo ""
            echo "ERROR: No ZIP files were found."
            echo ""
            echo "Everything downloaded:"
            find release_files -print
            exit 1
          fi

          echo ""
          echo "Found ${#ZIP_FILES[@]} ZIP file(s):"

          for FILE in "${ZIP_FILES[@]}"; do
            echo "  $FILE"
          done

      # ============================================================
      # 8. Create release notes file
      # ============================================================
      - name: Create release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release_notes.md

          echo "Release notes:"
          echo "----------------------------------------"
          cat release_notes.md
          echo "----------------------------------------"

      # ============================================================
      # 9. Create GitHub Release
      # ============================================================
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          echo "Creating GitHub Release $TAG..."

          mapfile -t ZIP_FILES < <(
            find release_files \
              -type f \
              -iname "*.zip"
          )

          gh release create "$TAG" \
            "${ZIP_FILES[@]}" \
            --title "V$NEW_VERSION" \
            --notes-file release_notes.md

          echo ""
          echo "=========================================="
          echo "        RELEASE CREATED SUCCESSFULLY"
          echo "=========================================="
          echo "Version: $NEW_VERSION"
          echo "Tag:     $TAG"
          echo ""
          echo "Assets:"
          for FILE in "${ZIP_FILES[@]}"; do
            echo "  $FILE"
          done
          echo "=========================================="
