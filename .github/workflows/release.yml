name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "What type of release is this?"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      release_notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Check out the repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Get the current version
      # ------------------------------------------------------------
      - name: Read current version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re

          with open("app.py", "r", encoding="utf-8") as f:
              text = f.read()

          # Look for something like:
          # VERSION = "1.2.3"
          match = re.search(
              r'^\s*VERSION\s*=\s*["'\''](\d+)\.(\d+)\.(\d+)["'\'']',
              text,
              re.MULTILINE
          )

          if not match:
              print("Could not find VERSION in app.py")
              raise SystemExit(1)

          print(".".join(match.groups()))
          PY
          )

          echo "Current version: $VERSION"
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 3. Calculate the new version
      # ------------------------------------------------------------
      - name: Calculate new version
        id: new_version
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$RELEASE_TYPE" in
            patch)
              PATCH=$((PATCH + 1))
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            *)
              echo "Invalid release type: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 4. Update VERSION in app.py
      # ------------------------------------------------------------
      - name: Update version
        shell: python
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          import re
          import os

          path = "app.py"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          new_text, count = re.subn(
              r'^(\s*VERSION\s*=\s*)["' + "'" + r']\d+\.\d+\.\d+(["' + "'" + r'])',
              r'\g<1>"' + os.environ["NEW_VERSION"] + r'"\2',
              text,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit("Could not find VERSION in app.py")

          with open(path, "w", encoding="utf-8") as f:
              f.write(new_text)

      # ------------------------------------------------------------
      # 5. Commit the new version
      # ------------------------------------------------------------
      - name: Commit version change
        shell: bash
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.py
          git commit -m "Bump version to $NEW_VERSION"

          git push

      # ------------------------------------------------------------
      # 6. Trigger the existing Build GeoTables workflow
      # ------------------------------------------------------------
      - name: Trigger Build GeoTables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering Build GeoTables..."

          gh workflow run "Build GeoTables"

      # ------------------------------------------------------------
      # 7. Wait for Build GeoTables to finish
      # ------------------------------------------------------------
      - name: Wait for Build GeoTables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for Build GeoTables..."

          for i in {1..60}; do
            RUN=$(gh run list \
              --workflow="Build GeoTables" \
              --limit=1 \
              --json databaseId,status,conclusion \
              --jq '.[0]')

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')

            echo "Status: $STATUS"
            echo "Conclusion: $CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "Build GeoTables failed."
                exit 1
              fi

              echo "Build GeoTables completed successfully."
              break
            fi

            sleep 10
          done

      # ------------------------------------------------------------
      # 8. Download the artifacts from Build GeoTables
      # ------------------------------------------------------------
      - name: Download Build GeoTables artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release_files

          RUN_ID=$(gh run list \
            --workflow="Build GeoTables" \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "Build run ID: $RUN_ID"

          gh run download "$RUN_ID" \
            --dir release_files

      # ------------------------------------------------------------
      # 9. Show what was downloaded
      # ------------------------------------------------------------
      - name: List release files
        run: |
          echo "Files produced by Build GeoTables:"
          find release_files -type f -print

      # ------------------------------------------------------------
      # 10. Create the Git tag
      # ------------------------------------------------------------
      - name: Create tag
        env:
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      # ------------------------------------------------------------
      # 11. Create the GitHub release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.new_version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          echo "Creating release v$NEW_VERSION"

          gh release create "v$NEW_VERSION" \
            release_files/**/* \
            --title "GeoTables v$NEW_VERSION" \
            --notes "$RELEASE_NOTES"
