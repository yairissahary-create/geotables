name: Build and Release GeoTables

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "What kind of release is this?"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

      release_notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Get the repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pyinstaller

      # --------------------------------------------------
      # Build GeoTables
      # --------------------------------------------------
      - name: Build GeoTables
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --icon=assets/icons/icon.ico \
            --add-data "assets;assets" \
            app.py

      # --------------------------------------------------
      # Create ZIP
      # --------------------------------------------------
      - name: Create release ZIP
        shell: powershell
        run: |
          $version = "build"

          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item "dist\GeoTables.exe" "release\GeoTables.exe"

          Compress-Archive `
            -Path "release\GeoTables.exe" `
            -DestinationPath "GeoTables-$version.zip" `
            -Force

      # --------------------------------------------------
      # Get latest version tag
      # --------------------------------------------------
      - name: Calculate new version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          latest_tag=$(git tag --list "v*" --sort=-version:refname | head -n 1)

          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
          fi

          version="${latest_tag#v}"

          IFS='.' read -r major minor patch <<< "$version"

          case "${{ inputs.release_type }}" in
            patch)
              patch=$((patch + 1))
              ;;

            minor)
              minor=$((minor + 1))
              patch=0
              ;;

            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;

            *)
              echo "Invalid release type"
              exit 1
              ;;
          esac

          new_version="$major.$minor.$patch"
          new_tag="v$new_version"

          echo "Latest tag: $latest_tag"
          echo "Release type: ${{ inputs.release_type }}"
          echo "New version: $new_version"
          echo "New tag: $new_tag"

          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Rename ZIP with actual version
      # --------------------------------------------------
      - name: Rename release ZIP
        shell: powershell
        run: |
          Rename-Item `
            "GeoTables-build.zip" `
            "GeoTables-${{ steps.version.outputs.version }}.zip"

      # --------------------------------------------------
      # Create Git tag
      # --------------------------------------------------
      - name: Create Git tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # --------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create \
            "${{ steps.version.outputs.tag }}" \
            "GeoTables-${{ steps.version.outputs.version }}.zip" \
            --title "GeoTables ${{ steps.version.outputs.version }}" \
            --notes "${{ inputs.release_notes }}"
